# Production on the VPS: the site and its Postgres database.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Settings come from deploy/.env (copy deploy/.env.example). HTTPS is handled by the host's
# shared edge proxy, which reaches `web` as `shahadat-web` over the `edge-shahadat` network
# and routes the domain with deploy/edge.caddy. The database sits on this stack's private
# network only.

name: shahadat-prod

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  web:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL}
    image: shahadat-portfolio/web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/portfolio
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      edge-shahadat:
        aliases: [shahadat-web]
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      retries: 20
    logging: *logging

networks:
  edge-shahadat:
    external: true
    name: edge-shahadat

volumes:
  pgdata:
